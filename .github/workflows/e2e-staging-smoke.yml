name: E2E Staging Smoke

on:
  workflow_dispatch:

jobs:
  e2e-staging-smoke:
    if: ${{ secrets.PLAYWRIGHT_STAGING_FRONTEND_URL != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright staging smoke lane
        env:
          PLAYWRIGHT_STAGING_FRONTEND_URL: ${{ secrets.PLAYWRIGHT_STAGING_FRONTEND_URL }}
          PLAYWRIGHT_STAGING_SEARCH_PATH: ${{ secrets.PLAYWRIGHT_STAGING_SEARCH_PATH }}
        run: npm run test:e2e:staging-smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-staging-smoke
          path: frontend/playwright-report
          if-no-files-found: ignore
